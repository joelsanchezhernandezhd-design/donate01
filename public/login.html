<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <header class="header">
        <div class="badge">Acceso</div>
        <h1>Iniciar sesión</h1>
        <p class="subtitle">
          Necesitás una cuenta para donar o entrar al panel. Por ahora solo el
          administrador está habilitado.
        </p>
      </header>

      <form id="login-form">
        <label class="field-label" for="username">Usuario</label>
        <input
          class="full-input"
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          required
          placeholder="usuario"
        />

        <label class="field-label" for="password">Contraseña</label>
        <input
          class="full-input"
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          placeholder="••••••••"
        />

        <button type="submit" class="donate-btn" id="login-btn">
          Entrar
        </button>
        <p id="login-error" class="error" hidden></p>
      </form>

      <footer class="footer">
        <a href="/" class="footer-link">Donaciones</a>
        <span>·</span>
        <a href="/admin.html" class="footer-link">Admin</a>
      </footer>
    </main>

    <script>
      (function () {
        const form = document.getElementById("login-form");
        const err = document.getElementById("login-error");
        const btn = document.getElementById("login-btn");
        const params = new URLSearchParams(location.search);
        const next = params.get("next") || "/";

        // Si ya hay sesión, redirigir
        fetch("/api/auth/me", { credentials: "include" })
          .then((r) => r.json())
          .then((d) => {
            if (d.authenticated) {
              if (d.user?.role === "admin" && next === "/admin.html") {
                location.replace("/admin.html");
              } else {
                location.replace(next.startsWith("/") ? next : "/");
              }
            }
          })
          .catch(() => {});

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          err.hidden = true;
          btn.disabled = true;
          btn.textContent = "Entrando…";
          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value,
              }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || "No se pudo iniciar sesión");

            // Clave de ofuscación de sesión (solo esta pestaña)
            if (data.k) {
              try {
                sessionStorage.setItem("donate_wk_v1", data.k);
              } catch (_) {}
            }

            if (data.user?.role === "admin" && (next === "/admin.html" || next === "/admin")) {
              location.href = "/admin.html";
            } else if (data.user?.role === "admin" && next === "/") {
              location.href = next;
            } else {
              location.href = next.startsWith("/") ? next : "/";
            }
          } catch (ex) {
            err.hidden = false;
            err.textContent = ex.message;
            btn.disabled = false;
            btn.textContent = "Entrar";
          }
        });
      })();
    </script>
  </body>
</html>
